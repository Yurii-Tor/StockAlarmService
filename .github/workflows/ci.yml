name: CI

on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Architectural gates: domain must not import providers (FR-0A8),
      # and must not read an ambient clock (NFR-05). Blocking, not advisory.
      - name: Lint (includes layering + clock gates)
        run: npm run lint

      - name: Typecheck (worker)
        run: npm run typecheck

      - name: Typecheck (web)
        run: npm run typecheck --workspace web

      - name: Unit and integration tests (workerd)
        run: npm test

      - name: Build web
        run: npm run build
